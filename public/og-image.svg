<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070a14" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="#070a14"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Decorative Abstract Geometric Accents -->
  <circle cx="1050" cy="150" r="300" fill="#7c3aed" opacity="0.12" filter="blur(60px)"/>
  <circle cx="150" cy="500" r="250" fill="#f97316" opacity="0.08" filter="blur(60px)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="0.75" opacity="0.25">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- Content Container -->
  <g transform="translate(100, 90)">
    <!-- Brand Pill -->
    <rect x="0" y="0" width="320" height="42" rx="21" fill="url(#badgeGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="22" cy="21" r="6" fill="#a855f7"/>
    <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#c084fc" letter-spacing="1.5">
      WE BUILD · WE SCALE · WE MARKET
    </text>

    <!-- Main Wordmark -->
    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="78" font-weight="900" fill="#ffffff" letter-spacing="-2">
      iWAAT<tspan fill="#8b5cf6">.</tspan>
    </text>

    <!-- Motto Definition -->
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" letter-spacing="2.5">
      INFORMATION · WEBSITE · APPS · ADS · TRANSPARENCY
    </text>

    <!-- Headline Value Proposition -->
    <text x="0" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-1">
      Engineering High-Performance
    </text>
    <text x="0" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#primaryGrad)" letter-spacing="-1">
      Digital Products & Growth Ecosystems
    </text>

    <!-- Capabilities Bar -->
    <g transform="translate(0, 390)">
      <rect x="0" y="0" width="1000" height="70" rx="20" fill="#0b1020" stroke="#1e293b" stroke-width="1.5"/>
      <text x="35" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#cbd5e1">
        ⚡ Custom Web Development  •  📱 Web & Mobile Apps  •  🎨 UI/UX Design  •  🚀 SEO & Growth
      </text>
    </g>
  </g>
</svg>
